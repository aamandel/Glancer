[pytest]
# pytest's faulthandler plugin must stay off. mpv embeds LuaJIT, which raises
# and handles its own Windows exceptions (code 0xE24C4A02) during normal use.
# faulthandler reacts to every exception, even handled ones, by dumping all
# Python thread stacks while those threads are running, and that dump itself
# segfaults intermittently.
addopts = -p no:faulthandler
